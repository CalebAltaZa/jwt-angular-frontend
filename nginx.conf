log_format jwt_main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version de nginx en el header Server ni en las paginas de error.
    server_tokens off;

    # Log de acceso montado desde el host para Fail2Ban (ver docker-compose.yml).
    access_log /var/log/nginx/access.log jwt_main;

    # --- Cabeceras de seguridad (hallazgos de Nuclei) -------------------------
    # 'always' para que apliquen tambien a respuestas 4xx/5xx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- API reverse proxy: el browser habla siempre con este origen ---------
    # /api/auth/*  ->  auth:8000/auth/*     (login, emisión del JWT)
    # /api/items/* ->  items:8001/items/*   (alta y listado, valida el Bearer)
    location /api/auth {
        proxy_pass http://auth:8000/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/items {
        proxy_pass http://items:8001/items;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/health {
        proxy_pass http://auth:8000/health;
    }

    # --- SPA ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
