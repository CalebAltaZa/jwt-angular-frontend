server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- API reverse proxy: el browser habla siempre con este origen ---------
    # /api/auth/*  ->  auth:8000/auth/*     (login, emisión del JWT)
    # /api/items/* ->  items:8001/items/*   (alta y listado, valida el Bearer)
    location /api/auth {
        proxy_pass http://auth:8000/auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/items {
        proxy_pass http://items:8001/items;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/health {
        proxy_pass http://auth:8000/health;
    }

    # --- SPA ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
